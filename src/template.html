<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <div class="header">
      <h1>WOOPS Weather</h1>
      <form>
        <label for="search"></label>
        <input type="search" name="search" id="search" placeholder="Search" />
        <button type="submit"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>magnify</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg></button>
      </form>
      <button id="toggle">Switch to °F</button>
    </div>
    <div class="content">
      <div id="current">
        <div class="info">
            <h2></h2>
            <div class="address"></div>
            <div class="description"></div>
            <div class="max"></div>
            <div class="min"></div>
            <div class="feels"></div>
            <div class="perci"></div>
        </div>
        <div class="image"></div>
      </div>
      <div class="prev-days">
        
      </div>
    </div>
    <div class="footer">
      <h7>Made by Kirito<a href="https://github.com/Kirito-exe/Weather-app">(github:kirito-exe)</a>;</h7>
      <div>Weather data from <a href="https://www.visualcrossing.com/">Visual Crossing</a></div>
    </div>
    <dialog>
      <div>Loading...</div>
    </dialog>
  </body>
</html>
