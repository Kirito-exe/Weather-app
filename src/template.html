<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <div class="header">
      <h1>WOOPS Weather</h1>
      <form>
        <label for="search"></label>
        <input type="search" name="search" id="search" placeholder="Search" />
        <button type="submit">󰍉</button>
      </form>
      <div class="buttons">
        <button>C</button>
        <button>F</button>
      </div>
    </div>
    <div class="content">
      <div id="current">
        <div class="info">
            <h2>0 Celsius</h2>
            <div class="address">Address</div>
            <div class="description">description</div>
            <div class="max">Maximum temp:0C</div>
            <div class="min">Minimum temp:0C</div>
            <div class="feels">Feels Like:0C</div>
            <div class="perci">Percipitation chance:</div>
        </div>
      </div>
      <div class="prev-days"></div>
    </div>
    <div class="footer">
      <h7>Made by Kirito(Discord:rtrd_abhii)</h7>
    </div>
  </body>
</html>
